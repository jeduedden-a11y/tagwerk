name: Bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Obsidian-Plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tagwerk-bridge
          path: |
            bridge/main.js
            bridge/manifest.json
            bridge/styles.css

  ios:
    name: iPhone-App
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 wählen
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=/Applications/Xcode.app; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Kern testen (TagwerkCore)
        id: coretests
        continue-on-error: true
        working-directory: Packages/TagwerkCore
        run: swift test 2>&1 | tail -120; exit ${PIPESTATUS[0]}

      - name: Ende-zu-Ende gegen GitHub (App-Kern -> Plugin -> App-Kern)
        id: e2e
        continue-on-error: true
        env:
          E2E_TOKEN: ${{ github.token }}
          E2E_REPO: ${{ github.repository }}
          E2E_BRANCH: e2e-${{ github.run_id }}
        run: |
          set -e
          export E2E_DATE=$(date -u +%F)
          git push -q "https://x-access-token:${E2E_TOKEN}@github.com/${E2E_REPO}.git" HEAD:refs/heads/${E2E_BRANCH}
          (cd Packages/TagwerkCore && swift run tagwerk-e2e push)
          (cd bridge && npm ci --silent && node --import tsx tests/e2e-real.ts)
          (cd Packages/TagwerkCore && swift run tagwerk-e2e verify)

      - name: Testzweig entfernen
        if: always()
        run: |
          for b in e2e-${{ github.run_id }} e2e-bridge; do
            git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete "$b" 2>/dev/null || true
          done

      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App bauen (unsigniert, für Sideloadly)
        run: |
          set -o pipefail
          xcodebuild -project Tagwerk.xcodeproj -scheme Tagwerk -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unavailable)|\*\* BUILD" || true
          # A failed build can leave a partial .app behind, so the log decides.
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log || { grep -E "error:" -A3 build.log | head -150; exit 1; }
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Tagwerk.app Payload/
          zip -qry Tagwerk.ipa Payload
          ls -la Tagwerk.ipa

      - name: Simulator-Build mit Demo-Daten
        run: |
          set -o pipefail
          xcodebuild -project Tagwerk.xcodeproj -scheme Tagwerk -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            build 2>&1 | tail -5

      - name: Screenshots
        run: scripts/screenshots.sh build-sim/Build/Products/Debug-iphonesimulator/Tagwerk.app shots

      - name: Screenshots in Branch ablegen
        if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] && [ -n "$(ls -A shots)" ] || exit 0
          cd shots
          git init -q -b ci-screenshots
          git config user.name "tagwerk-ci"
          git config user.email "tagwerk-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Testergebnisse
        if: steps.coretests.outcome == 'failure' || steps.e2e.outcome == 'failure'
        run: |
          echo "::error::Kern-Tests: ${{ steps.coretests.outcome }}, Ende-zu-Ende: ${{ steps.e2e.outcome }}"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Tagwerk-ipa
          path: Tagwerk.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore

  release:
    name: Release „latest“ aktualisieren
    needs: [bridge, ios]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release schreiben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          (cd tagwerk-bridge && zip -q ../tagwerk-bridge.zip main.js manifest.json styles.css)
          cp Tagwerk-ipa/Tagwerk.ipa .
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Tagwerk.ipa tagwerk-bridge.zip \
            --title "Tagwerk – neuester Stand" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Tagwerk.ipa mit Sideloadly installieren, tagwerk-bridge.zip nach .obsidian/plugins/tagwerk-bridge entpacken." \
            --latest
